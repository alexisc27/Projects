services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: porterdispatch
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: porter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter -d porterdispatch"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/porterdispatch
      DB_USER: porter
      DB_PASSWORD: porter
    ports:
      - "8080:8080"

volumes:
  pgdata:
